<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Next Culture · 팀 대화 진단 (WFG)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"><link href="https://fonts.googleapis.com/css2?family=family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F4;--surface:#FFFFFF;--surface2:#E9ECE8;--ink:#0F1B2D;--muted:#5E6A78;--line:#DCDFDB;--navy:#1F3F73;--navy2:#8FA5C8;--amber:#C07A1E;--amber2:#E3BE87;--red:#A8141C;--accent-ink:#FFFFFF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E141C;--surface:#161E29;--surface2:#212B38;--ink:#E9EDF2;--muted:#9AA6B4;--line:#2D3846;--navy:#8FA9D6;--navy2:#4E6790;--amber:#E0A04A;--amber2:#8A6630;--red:#E06A6A;--accent-ink:#0E141C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E141C;--surface:#161E29;--surface2:#212B38;--ink:#E9EDF2;--muted:#9AA6B4;--line:#2D3846;--navy:#8FA9D6;--navy2:#4E6790;--amber:#E0A04A;--amber2:#8A6630;--red:#E06A6A;--accent-ink:#0E141C;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.65}
.wrap{max-width:820px;margin:0 auto;padding:28px 20px 80px}
.serif{font-family:'Noto Serif KR','AppleMyungjo',serif}
h1{font-family:'Noto Serif KR','AppleMyungjo',serif;font-size:30px;line-height:1.35;margin:0 0 12px;font-weight:600}
h2{font-family:'Noto Serif KR','AppleMyungjo',serif;font-size:22px;line-height:1.4;margin:0 0 8px;font-weight:600}
h3{font-size:16px;margin:0 0 6px;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted)} .small{font-size:14px}
.label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);letter-spacing:.5px;margin:0 0 10px}
.label::before{content:"";width:26px;height:2px;background:var(--red)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:24px;margin:0 0 16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px}
button.primary{background:var(--navy);color:var(--accent-ink);border-color:var(--navy);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
input[type=text],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%}
textarea{min-height:76px;resize:vertical}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.progress{height:4px;background:var(--surface2);overflow:hidden;margin:0 0 20px}
.progress>i{display:block;height:100%;background:var(--red);transition:width .25s}
.stmt{font-family:'Noto Serif KR',serif;font-size:21px;font-weight:600;line-height:1.5;margin:6px 0 18px}
.scale{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{border:1px solid var(--line);border-radius:4px;text-align:center;padding:12px 4px;cursor:pointer;background:var(--surface);user-select:none;font-size:14.5px;font-weight:500}
.opt[aria-checked="true"]{background:var(--navy);color:var(--accent-ink);border-color:var(--navy)}
.err{color:var(--red);font-size:14px;margin:8px 0 0}
.dist{display:flex;height:22px;overflow:hidden;margin:6px 0 4px}
.dist>div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;margin-right:4px;vertical-align:-1px}
.item{padding:14px 0;border-top:1px solid var(--line)} .item:first-of-type{border-top:none}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:2px;margin-left:6px}
.t-hi{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.t-md{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.t-lo{background:var(--surface2);color:var(--muted)}
.voice{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:8px 0;font-size:14.5px}
.dir{font-size:14.5px;color:var(--navy);margin-top:6px}
.stage{border-top:3px solid var(--navy);padding-top:6px}
.notice{background:var(--surface2);padding:12px 14px;font-size:14px;margin:0 0 14px}
.shift{display:grid;grid-template-columns:1fr 84px 84px 70px;gap:8px;align-items:center;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.shift .n{text-align:center;font-variant-numeric:tabular-nums}
.three{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);margin-top:14px}
.three>div{padding:12px 14px 0 0} .three>div+div{border-left:1px solid var(--line);padding-left:14px}
@media (max-width:640px){.scale{grid-template-columns:1fr 1fr}.three{grid-template-columns:1fr}.three>div+div{border-left:none;padding-left:0;border-top:1px solid var(--line)}.shift{grid-template-columns:1fr 60px 60px 50px}h1{font-size:25px}}
@media (prefers-reduced-motion:reduce){.progress>i{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<script>
const DEFAULT_S=[
 {t:'팀원 양성보다는 업무 성과가 우선시되어야만 한다.',d:'성과와 팀원 양성 중 무엇을 먼저 챙기고 있는지 솔직하게 나누고, 두 가지를 함께 가져가기 위한 우리 팀의 우선순위 기준을 정합니다.'},
 {t:'피드백 방법이 바뀌면 결과는 변한다.',d:'피드백 방법과 결과 변화의 관계를 짚어 보고, 우리 팀에서 효과적으로 작동하는 피드백 방식을 정합니다.'},
 {t:'그룹 회의에서 침묵하는 팀원은 동의하는 것으로 봐야만 한다.',d:'회의에서 침묵이 어떤 의미로 읽히는지 토의하고, 모두가 발언할 수 있는 우리 팀의 회의 원칙을 만듭니다.'},
 {t:'어떤 사람이 특정 분야의 전문가라고 입증되면, 그 사람은 그룹의 토론과 의사결정에 큰 영향을 미쳐야 한다.',d:'경험과 연차에서 비롯된 영향력을 어떻게 다룰지 논의하고, 전문성과 새로운 시도 사이에서 따를 의사결정 방식을 정합니다.'},
 {t:'일부 구성원이 불편해하더라도, 그룹 내 협업에 대해서는 언제든 공개적으로 토론할 수 있어야 한다.',d:'불편하더라도 짚어야 할 협업 문제를 꺼내고, 공개적으로 논의할 것과 개별적으로 다룰 것의 기준을 정합니다.'},
 {t:'그룹 내에 의견 불일치가 있을 때, 투표가 추후의 갈등을 피하기 위한 가장 적합한 의사결정 방법이다.',d:'투표가 정말 갈등을 줄여 주는지 토의하고, 의견 차이를 풀기 위한 우리 팀만의 의사결정 방식을 정합니다.'},
 {t:'그룹은 항상 리더를 정해야 하며, 리더는 필요할 때 결론을 요약하고 불필요한 토론을 정리하는 일을 주도한다.',d:'리더가 토론을 정리하고 결론을 이끄는 역할의 범위를 짚고, 우리 팀에서 그 역할이 실제로 작동하는 방식을 정합니다.'},
 {t:'필요에 따라 서로의 의견이나 행동을 비판해야 그룹원들이 최상의 결과를 낼 수 있다.',d:'비판적 피드백이 정말 최상의 결과로 이어지는지 토의하고, 건설적인 비판이 오가는 방식을 정합니다.'},
 {t:'시간이 오래 걸리고 효율적인 문제 해결에 방해가 되더라도, 모든 그룹원의 의견을 들어봐야 한다.',d:'속도와 모두의 참여 중 무엇을 우선할지 상의하고, 시간이 걸리더라도 의견을 들어야 하는 순간을 정합니다.'},
 {t:'그룹에서 의견 불일치가 생길 때는 감정을 배제하고 사실에만 집중하는 것이 중요하다.',d:'감정이 올라오는 순간을 솔직하게 나누고, 사실에 집중하기 위해 우리 팀이 실천할 방법을 정합니다.'}];
let S=DEFAULT_S.slice();
const PAGE_URL='https://claude.ai/artifact/G2wpjWvd8fdit5wrwZzX5x';
const LV=['강하게 반대','반대','동의','강하게 동의'];
const LC=['var(--amber)','var(--amber2)','var(--navy2)','var(--navy)'];
const MIN_N=3;
let st={screen:'intro',team:'',round:'pre',step:0,a:{},voice:'',scs:{start:'',keep:'',stop:''},err:'',saved:null,rep:null,src:'',teamSel:'',match:null,notes:{},plan:{},scsSum:null};
let caps={db:null,user:null,sample:null,downloads:null,canEdit:false};
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STEPS=new Proxy([],{get:(t,k)=>{const a=['info',...S.map((_,i)=>'s'+i),'voice'];const v=a[k];return typeof v==='function'?v.bind(a):v}});

function render(){const app=document.getElementById('app');app.innerHTML='';app.append({intro:introV,survey:surveyV,done:doneV,report:reportV,admin:adminV,co:coV}[st.screen]());window.scrollTo({top:0})}
function introV(){
 const T=st.sess; const closed=T&&T.open===false;
 const el=$(`<div><div class="panel" style="padding:30px"><p class="label">PAUL &amp; MARK · NEXT CULTURE</p>
 ${T?`<p class="small" style="margin:0 0 6px"><b>${esc(T.name)}</b></p>`:''}
 <h1>우리 팀은 같은 질문에 어떻게 답할까요?</h1>
 <p class="muted">Well-Functioning Group: 팀이 함께 일하는 방식에 관한 ${S.length}개의 명제입니다. 정답은 없습니다. 지금 내 생각에 가장 가까운 쪽을 고르면 됩니다. 약 5분.</p>
 <div class="three"><div><h3>Diversity</h3><p class="small muted">같은 명제에 서로 다른 생각이 드러납니다.</p></div><div><h3>Dialogue</h3><p class="small muted">갈린 명제가 팀 대화의 출발점이 됩니다.</p></div><div><h3>Drive</h3><p class="small muted">대화 뒤 다시 답하면, 무엇이 움직였는지 보입니다.</p></div></div></div>
 ${closed?'<div class="notice">이 워크숍 진단은 마감되었습니다. 참여해 주셔서 감사합니다.</div>':''}
 ${T?'':`<div class="panel"><h3>퍼실리테이터가 알려준 코드를 입력하세요</h3><div class="row"><input type="text" id="code" maxlength="8" style="max-width:200px;font-size:20px;letter-spacing:4px;text-transform:uppercase" aria-label="워크숍 코드"><button id="enter">들어가기</button></div><p class="err" id="cerr">${esc(st.sessErr||'')}</p></div>`}
 <div class="row">${T&&!closed?'<button class="primary" id="go">시작하기</button>':''}<button id="smp">팀 리포트 예시 보기</button><span id="adm"></span></div></div>`);
 const go=el.querySelector('#go');if(go)go.onclick=()=>{st={...st,screen:'survey',step:0,a:{},voice:'',scs:{start:'',keep:'',stop:''},err:'',saved:null};render()};
 const en=el.querySelector('#enter');if(en)en.onclick=()=>{const c=el.querySelector('#code').value.trim().toUpperCase();if(c)loadSess(c,true)};
 el.querySelector('#smp').onclick=()=>{S=DEFAULT_S.slice();st.rep=sample();st.src='sample';st.teamSel=Object.keys(st.rep.teams)[0];st.match=null;st.screen='report';render()};
 if(caps.canEdit){const b=$(`<button>워크숍 관리 (폴앤마크)</button>`);b.onclick=openAdmin;el.querySelector('#adm').append(b)}
 return el;
}
async function loadSess(code,manual){
 st.sessErr='';
 if(!caps.db){if(manual){st.sessErr='이 화면에서는 워크숍에 연결할 수 없습니다.';render()}return}
 try{const sn=await caps.db.doc('wfg_sessions/'+code).get();const d=sn&&sn.data?sn.data():null;
  if(!d||d.kind==='code'){st.sess=null;st.sessErr='이 코드의 워크숍을 찾지 못했습니다.';render();return}
  st.sess={code,...d};S=(d.stmts&&d.stmts.length?d.stmts:DEFAULT_S).slice();if(st.screen==='intro')render()}
 catch(e){st.sessErr='워크숍에 연결하지 못했습니다. 이 페이지에 참여 권한이 있는지 확인해 주세요.';if(st.screen==='intro')render()}
}
async function openAdmin(){
 st.screen='admin';render();
 try{const [a,b]=await Promise.all([caps.db.collection('wfg_sessions').limit(200).get(),caps.db.collection('wfg_resp').limit(1000).get()]);
  const resp=b.docs.map(d=>d.data()).filter(Boolean);
  st.sessions=a.docs.filter(d=>{const x=d.data()||{};return x.kind!=='code'}).map(d=>{const x=d.data()||{};return {code:d.id,...x,pre:resp.filter(r=>r[d.id+'_pre']).length,post:resp.filter(r=>r[d.id+'_post']).length}}).sort((x,y)=>(y.at||0)-(x.at||0));st.adminErr='';render()}
 catch(e){st.sessions=[];st.adminErr='워크숍 목록을 불러오지 못했습니다.';render()}
}
function adminV(){
 const draft=st.draft||DEFAULT_S.map(x=>`${x.t} | ${x.d}`).join('\n');
 const el=$(`<div><div class="panel"><p class="label">워크숍 관리</p><h2>새 워크숍 만들기</h2>
  <label class="small" for="nm">회사 · 팀 이름</label><input type="text" id="nm" maxlength="60" placeholder="예: 대덕전자 · 생산기술 2팀">
  <p class="small" style="margin:14px 0 4px"><b>명제</b> — 한 줄에 하나, “명제 | 대화 방향” 형식. 5~12개. 기본 명제 10개가 들어 있습니다.</p>
  <textarea id="st" style="min-height:260px;font-size:14px">${esc(draft)}</textarea>
  <details style="margin-top:10px"><summary class="small"><b>고충으로 명제 후보 만들기</b> (Claude)</summary>
   <p class="small muted" style="margin:8px 0 4px">사전 설문에서 받은 ‘답답했던 순간’을 붙여넣으면, 딜레마즘 원칙대로 명제 후보 10개를 위 칸에 채워 줍니다. 고른 뒤 다듬어 쓰세요.</p>
   <textarea id="iss" placeholder="한 줄에 하나씩 붙여넣기"></textarea><div class="row" style="margin-top:6px"><button id="gen" ${caps.sample?'':'disabled'}>명제 후보 만들기</button><span class="small muted" id="gSt"></span></div></details>
  <p class="err" id="aerr"></p><div class="row"><button class="primary" id="mk">만들고 코드 받기</button></div></div>
 <div class="panel"><h2>진행 중인 워크숍</h2>${st.adminErr?`<p class="err">${esc(st.adminErr)}</p>`:''}${(st.sessions||[]).length?st.sessions.map(o=>`<div class="item"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">${esc(o.name)} <span class="small muted">· 코드 ${esc(o.code)}${o.open===false?' · 마감':''}</span></h3><p class="small muted" style="margin:2px 0 0">명제 ${(o.stmts||[]).length}개 · 워크숍 전 ${o.pre}명 · 워크숍 후 ${o.post}명</p></div><div class="row"><button data-rep="${esc(o.code)}">팀 리포트</button><button data-tog="${esc(o.code)}">${o.open===false?'다시 열기':'마감하기'}</button></div></div><p class="small" style="margin:8px 0 0">공유 링크: <input type="text" readonly value="${PAGE_URL}#${esc(o.code)}" style="font-size:13px;padding:6px 8px" onclick="this.select()"></p></div>`).join(''):'<p class="small muted">아직 만든 워크숍이 없습니다.</p>'}</div>
 ${(()=>{const cos=[...new Set((st.sessions||[]).map(o=>coName(o.name)))];return cos.length?`<div class="panel"><h2>회사별 ‘우리가 일하는 방식’ 모으기</h2><p class="small muted">팀마다 정한 우리의 문장을 회사 단위로 모아, 회사 전체의 문장으로 다듬습니다. 워크숍 이름의 ‘·’ 앞부분을 회사 이름으로 봅니다.</p><div class="row">${cos.map(c=>`<button data-co="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>`:''})()}
 <div class="row"><button id="home">처음으로</button></div></div>`);
 el.querySelectorAll('[data-co]').forEach(b=>b.onclick=()=>openCo(b.dataset.co));
 el.querySelector('#st').oninput=e=>st.draft=e.target.value;
 el.querySelector('#home').onclick=()=>{st.screen='intro';render()};
 el.querySelector('#gen').onclick=async()=>{const iss=el.querySelector('#iss').value.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,80);const g=el.querySelector('#gSt');if(!iss.length){g.textContent='고충을 먼저 붙여넣어 주세요.';return}
  g.textContent='Claude가 명제를 만드는 중입니다…';
  const prompt=`당신은 폴앤마크의 퍼실리테이터입니다. 아래는 한 팀의 구성원들이 쓴 '함께 일하며 가장 답답했던 순간'입니다. 이 고충에 뿌리를 둔 팀 워크숍용 딜레마 명제 10개를 만드세요.
원칙: 1) 단정형 당위 "~해야만 한다"로 끝맺는다. 2) 동의와 반대 양쪽 모두에 진짜 대가가 있어 정답이 뻔하지 않아야 한다. 3) 실제 고충에 붙인다. 4) 층위를 얕은 것(팀워크)에서 깊은 것(정체성·주인의식)으로 배치하고, 서로 긴장을 이루는 명제를 함께 둔다. 5) 각 명제에 '대화 방향'을 "~을 정합니다"로 끝나는 한 문장으로 붙인다. 개인을 짐작할 수 있는 표현은 쓰지 않는다.

function statsFor(list){

 post.forEach((r,k)=>{r.rec.voice=['침묵이 동의가 아니라는 걸 다들 알게 된 것','연차보다 근거로 이야기하자는 원칙','',''][k%4];r.rec.scs={start:['회의 끝에 한 명씩 돌아가며 한마디','막내부터 의견 말하기','결정 이유를 회의록에 남기기','','회의 전에 안건 미리 공유'][k%5],keep:['문제 생기면 바로 공유하는 습관','서로 돕는 분위기','','주간 회의','바로 공유하기'][k%5],stop:['“그거 해 봤는데 안 돼”로 시작하는 말','기한 다 돼서 안 된다고 말하기','','회의에서 리더가 먼저 결론 말하기','“해 봤는데 안 돼”'][k%5]}});
 const out=agg(pre,post);st.plan={'예시 · 생산기술 2팀':{start:'회의 끝 ‘한 명씩 한마디’ (담당: 팀장, 다음 주부터)\n결정 이유를 회의록 첫 줄에 쓰기 (담당: 서기 순번)',keep:'문제가 생기면 바로 공유하는 습관',stop:'“해 봤는데 안 돼”로 논의를 닫는 말',check:'6주 뒤 팀 회의에서 WFG 재응답'}};return out;
}
render();
(async()=>{
 if(!window.claude||!window.claude.use)return;
 try{caps.user=await window.claude.use('user')}catch(e){}
 try{caps.db=await window.claude.use('db')}catch(e){}
 try{caps.sample=await window.claude.use('sample')}catch(e){}
 try{caps.downloads=await window.claude.use('downloads')}catch(e){}
 try{caps.canEdit=caps.user?await caps.user.canEdit():false}catch(e){}
 if(!caps.db)caps.canEdit=false;
 if(!caps.canEdit)caps.sample=null;
 const h=(location.hash||'').replace('#','').trim().toUpperCase();
 if(h&&/^[A-Z0-9]{4,8}$/.test(h))await loadSess(h,false);
 if(st.screen==='intro')render();
 window.addEventListener('hashchange',()=>{const c=(location.hash||'').replace('#','').trim().toUpperCase();if(c&&/^[A-Z0-9]{4,8}$/.test(c)){st.screen='intro';loadSess(c,false)}});
})();
</script>
