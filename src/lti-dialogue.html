<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LTI 대화 · 8가지 리더십 과제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6F4;--surface:#FFFFFF;--surface2:#E9ECE8;--ink:#0F1B2D;--muted:#5E6A78;--line:#DCDFDB;--navy:#1F3F73;--navy2:#8FA5C8;--amber:#C07A1E;--red:#A8141C;--q1:#2f7f8d;--q2:#3b4fa0;--q3:#b07c22;--q4:#a8474f;--accent-ink:#FFFFFF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E141C;--surface:#161E29;--surface2:#212B38;--ink:#E9EDF2;--muted:#9AA6B4;--line:#2D3846;--navy:#8FA9D6;--navy2:#4E6790;--amber:#E0A04A;--red:#E06A6A;--q1:#5fb3c1;--q2:#8c9cf0;--q3:#d9a64a;--q4:#d97d85;--accent-ink:#0E141C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E141C;--surface:#161E29;--surface2:#212B38;--ink:#E9EDF2;--muted:#9AA6B4;--line:#2D3846;--navy:#8FA9D6;--navy2:#4E6790;--amber:#E0A04A;--red:#E06A6A;--q1:#5fb3c1;--q2:#8c9cf0;--q3:#d9a64a;--q4:#d97d85;--accent-ink:#0E141C;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:16px;line-height:1.6}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px}
h1{font-family:'Noto Serif KR',serif;font-size:30px;line-height:1.35;margin:0 0 12px;font-weight:600}
h2{font-family:'Noto Serif KR',serif;font-size:22px;line-height:1.4;margin:0 0 8px;font-weight:600}
h3{font-size:16px;margin:0 0 6px;font-weight:700}
p{margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:14px}
.label{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);letter-spacing:.5px;margin:0 0 10px}.label::before{content:"";width:26px;height:2px;background:var(--red)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px;margin:0 0 16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;border-radius:4px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px}
button.primary{background:var(--navy);color:var(--accent-ink);border-color:var(--navy);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,.opt:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 12px;width:100%}
textarea{min-height:60px;resize:vertical}
.code{font-family:'Noto Serif KR',serif;font-size:40px;font-weight:600;letter-spacing:8px}
.task{padding:14px 0;border-top:1px solid var(--line)}.task:first-of-type{border-top:none}
.qtag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:2px;color:#fff;margin-right:6px}
.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.opt{border:1px solid var(--line);border-radius:4px;text-align:center;padding:10px 4px;cursor:pointer;background:var(--surface);user-select:none;font-size:14px}
.opt[aria-checked="true"]{background:var(--navy);color:var(--accent-ink);border-color:var(--navy)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600}td.n{text-align:center}
.notice{background:var(--surface2);padding:12px 14px;font-size:14px;margin:0 0 14px}
.err{color:var(--red);font-size:14px;margin:8px 0 0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:18px;vertical-align:middle;margin-right:4px}
.pq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:680px){.grid2{grid-template-columns:1fr}.pq{grid-template-columns:1fr 1fr}h1{font-size:25px}}
</style>
</head>
<body>
<div class="wrap" id="app" aria-live="polite"></div>
<script>
const PAGE_URL='https://claude.ai/artifact/Y2pnCJQpxtKHZQDF8W7tKr';
const TASKS=[
 {k:'1R',q:1,n:'사람을 돌봄',d:'시간을 내어 듣고, 공감하며, 사람들이 성장하도록 격려합니다.'},
 {k:'1L',q:1,n:'상호작용 촉진',d:'사람과 아이디어를 모으고, 아직 다듬어지지 않은 생각도 함께 키웁니다.'},
 {k:'2R',q:2,n:'정보 수집',d:'계획과 결정을 위해 데이터와 정보를 정리하고, 바깥의 현실을 안으로 들여옵니다.'},
 {k:'2L',q:2,n:'구조 제공',d:'결단력 있게 방향을 주고, 알맞은 단위와 절차를 만듭니다.'},
 {k:'3L',q:3,n:'운영 유지',d:'매일의 절차가 효율적으로 돌아가는지 살피고, 일이 궤도를 지키게 합니다.'},
 {k:'3R',q:3,n:'실행 압박',d:'생산성과 책임을 앞세우고, 결과까지 밀고 나갑니다.'},
 {k:'4L',q:4,n:'자원 연결',d:'밖으로 나가 자원과 기회를 끌어오고, 활동 반경을 넓힙니다.'},
 {k:'4R',q:4,n:'현상에 도전',d:'무엇을 어떻게 바꿀지 그리고, 경계를 넓히며, 지금의 방식에 질문을 던집니다.'}];
const QN={1:'함께 성장하는 문화',2:'체계와 원칙의 문화',3:'실행과 결과의 문화',4:'도전과 변화의 문화'};
const QW={1:'Why',2:'What',3:'How',4:'If'};
const QC={1:'var(--q1)',2:'var(--q2)',3:'var(--q3)',4:'var(--q4)'};
const LV=[[40,'나의 강점'],[30,'보통'],[20,'강점이 아님']];
let st={screen:'intro',code:'',sess:null,mine:{},nick:'',marks:[],demo:false,timer:null};
let caps={db:null,user:null,canEdit:false};
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:NaN;
function stopT(){if(st.timer){clearInterval(st.timer);st.timer=null}}
function render(){const app=document.getElementById('app');app.innerHTML='';app.append({intro:introV,answer:answerV,done:doneV,create:createV,board:boardV}[st.screen]());window.scrollTo({top:0})}

function radar(webs,orgDes,orgCur,size=420){
 const c=size/2,R=size*0.36; const ang=i=>(-90+22.5+i*45)*Math.PI/180;
 const pt=(i,v)=>{const r=R*(0.25+0.75*(v-20)/20);return [c+r*Math.cos(ang(i)),c+r*Math.sin(ang(i))]};
 let g=`<svg viewBox="0 0 ${size} ${size}" role="img" aria-label="8가지 리더십 과제 그래프" style="width:100%;max-width:${size}px;height:auto;display:block;margin:0 auto">`;
 [[1,-90,0],[2,0,90],[3,90,180],[4,180,270]].forEach(([q,a0,a1])=>{const p0=[c+R*1.08*Math.cos(a0*Math.PI/180),c+R*1.08*Math.sin(a0*Math.PI/180)],p1=[c+R*1.08*Math.cos(a1*Math.PI/180),c+R*1.08*Math.sin(a1*Math.PI/180)];g+=`<path d="M${c},${c} L${p0[0]},${p0[1]} A${R*1.08},${R*1.08} 0 0 1 ${p1[0]},${p1[1]} Z" fill="${QC[q]}" opacity=".07"/>`});
 [20,30,40].forEach(v=>{const r=R*(0.25+0.75*(v-20)/20);g+=`<circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="var(--line)" stroke-dasharray="${v===40?'0':'3 3'}"/>`});
 g+=`<line x1="${c-R*1.1}" y1="${c}" x2="${c+R*1.1}" y2="${c}" stroke="var(--line)"/><line x1="${c}" y1="${c-R*1.1}" x2="${c}" y2="${c+R*1.1}" stroke="var(--line)"/>`;
 TASKS.forEach((t,i)=>{const [x,y]=[c+R*1.0*Math.cos(ang(i)),c+R*1.0*Math.sin(ang(i))];g+=`<line x1="${c}" y1="${c}" x2="${x}" y2="${y}" stroke="var(--line)" stroke-width=".6"/>`;const [lx,ly]=[c+R*1.24*Math.cos(ang(i)),c+R*1.24*Math.sin(ang(i))];g+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="var(--ink)">${t.n}</text><text x="${lx}" y="${ly+14}" text-anchor="middle" font-size="10" fill="var(--muted)">${t.k}</text>`});
 [[1,45],[2,135],[3,225],[4,315]].forEach(([q,a])=>{const p=[c+R*0.55*Math.cos((a-90)*Math.PI/180),c+R*0.55*Math.sin((a-90)*Math.PI/180)];g+=`<text x="${p[0]}" y="${p[1]}" text-anchor="middle" font-size="22" font-weight="700" fill="${QC[q]}" opacity=".35">${q}</text>`});
 const poly=(vals)=>vals.map((v,i)=>pt(i,v).map(n=>n.toFixed(1)).join(',')).join(' ');
 const orgVals=(o)=>TASKS.map(t=>20+(isNaN(o[t.q])?0:o[t.q])/100*20);
 if(orgCur)g+=`<polygon points="${poly(orgVals(orgCur))}" fill="none" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="2 3"/>`;
 if(orgDes)g+=`<polygon points="${poly(orgVals(orgDes))}" fill="none" stroke="var(--red)" stroke-width="2.2" stroke-dasharray="7 4"/>`;
 webs.forEach(w=>{g+=`<polygon points="${poly(w.v)}" fill="${w.fill||'none'}" fill-opacity="${w.fo||0}" stroke="${w.c}" stroke-width="${w.sw||1}" opacity="${w.o||1}"/>`});
 return g+'</svg>';
}
function legendHTML(hasOrg){return `<div class="legend"><span><i style="border-top:2.5px solid var(--navy)"></i>리더 평균</span><span><i style="border-top:1px solid var(--navy2)"></i>리더 한 사람</span>${hasOrg?'<span><i style="border-top:2px dashed var(--red)"></i>조직이 바라는 모습</span><span><i style="border-top:1.5px dotted var(--muted)"></i>조직의 지금</span>':''}</div>`}

function introV(){
 stopT();const S=st.sess;
 const el=$(`<div><div class="panel" style="padding:30px"><p class="label">PAUL &amp; MARK · LTI 대화</p>${S?`<p class="small" style="margin:0 0 6px"><b>${esc(S.name)}</b></p>`:''}
 <h1>나는 어떤 리더이고, 우리 조직은 어디로 가고 싶을까요?</h1>
 <p class="muted">좋은 리더는 서로 반대쪽에 있는 과제들을 함께 다룹니다. 여덟 가지 리더십 과제에서 내 강점을 표시하고, 리더들의 강점을 조직이 바라는 방향 위에 겹쳐 봅니다. 약 3분.</p>
 <p class="small muted">출처: About Learning, Leading the Learning Organization — 4MAT Leadership Cycle (Quinn, 1991)</p></div>
 ${S?'':`<div class="panel"><h3>진행자가 알려준 코드를 입력하세요</h3><div class="row"><input type="text" id="c" maxlength="8" style="max-width:200px;font-size:20px;letter-spacing:4px;text-transform:uppercase" aria-label="코드"><button id="enter">들어가기</button></div><p class="err" id="cerr">${esc(st.err||'')}</p></div>`}
 <div class="row">${S&&S.open!==false?'<button class="primary" id="go">내 강점 표시하기</button>':''}<button id="demo">대화 보드 예시 보기</button><span id="adm"></span></div></div>`);
 const go=el.querySelector('#go');if(go)go.onclick=()=>{st.mine={};st.screen='answer';render()};
 const en=el.querySelector('#enter');if(en)en.onclick=()=>{const v=el.querySelector('#c').value.trim().toUpperCase();if(v)loadSess(v,true)};
 el.querySelector('#demo').onclick=()=>{st.demo=true;st.sess=demoSess();st.code='DEMO';st.marks=demoMarks();st.screen='board';render()};
 if(caps.canEdit){const b=$(`<button>새 대화 만들기 (진행자)</button>`);b.onclick=()=>{st.screen='create';render()};el.querySelector('#adm').append(b);const b2=$(`<button>진행 중인 보드 열기</button>`);b2.onclick=openList;el.querySelector('#adm').append(b2)}
 return el;
}
async function loadSess(code,manual){
 st.err='';if(!caps.db){if(manual){st.err='이 화면에서는 연결할 수 없습니다.';render()}return}
 try{const sn=await caps.db.doc('lti_sessions/'+code).get();const d=sn&&sn.data?sn.data():null;if(!d){st.sess=null;st.err='이 코드를 찾지 못했습니다.';render();return}st.sess={code,...d};st.code=code;st.demo=false;if(st.screen==='intro')render()}
 catch(e){st.err='연결하지 못했습니다. 이 페이지에 참여 권한이 있는지 확인해 주세요.';render()}
}
function answerV(){
 const el=$(`<div><div class="panel"><p class="label">${esc(st.sess.name)}</p><h1>여덟 가지 과제에서 나의 강점은?</h1><p class="muted">사람마다 잘하는 과제가 다릅니다. 지금의 나에 가장 가까운 쪽을 고르세요.</p>
 <label class="small" for="nk">이름 또는 별칭 (선택, 보드에는 나오지 않고 대화할 때만 씁니다)</label><input type="text" id="nk" maxlength="20" value="${esc(st.nick)}"></div>
 <div class="panel">${TASKS.map((t,i)=>`<div class="task"><p style="margin:0"><span class="qtag" style="background:${QC[t.q]}">${t.q} · ${QW[t.q]}</span><b>${t.n}</b> <span class="small muted">${t.k}</span></p><p class="small muted" style="margin:4px 0 0">${t.d}</p><div class="scale" role="radiogroup" aria-label="${t.n}">${LV.map(([v,l])=>`<div class="opt" role="radio" tabindex="0" data-i="${i}" data-v="${v}" aria-checked="${st.mine[i]===v}">${l} (${v})</div>`).join('')}</div></div>`).join('')}</div>
 <p class="err" id="err"></p><div class="row"><button class="primary" id="go">제출하기</button></div></div>`);
 el.querySelector('#nk').oninput=e=>st.nick=e.target.value;
 el.querySelectorAll('.opt').forEach(o=>{const pick=()=>{st.mine[+o.dataset.i]=+o.dataset.v;o.parentElement.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-checked',x===o))};o.onclick=pick;o.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick()}}});
 el.querySelector('#go').onclick=async()=>{
  const miss=TASKS.filter((_,i)=>!st.mine[i]).length;if(miss){el.querySelector('#err').textContent=`아직 고르지 않은 과제가 ${miss}개 있습니다.`;return}
  const strong=TASKS.filter((_,i)=>st.mine[i]===40).length;if(strong>4){el.querySelector('#err').textContent='‘나의 강점’은 네 개까지만 골라 주세요. 모두 강점이면 대화가 생기지 않습니다.';return}
  st.saved=null;st.screen='done';render();
  try{const id=await caps.user.id();const ref=caps.db.doc('lti_marks/'+id);let cur={};try{const sn=await ref.get();cur=(sn&&sn.data&&sn.data())||{}}catch(e){}cur[st.code]={at:Date.now(),m:TASKS.map((_,i)=>st.mine[i]),nick:st.nick.trim().slice(0,20)};await ref.set(cur);st.saved=true}catch(e){st.saved=false}
  const n=document.getElementById('sv');if(n)n.textContent=st.saved?'보드로 보내졌습니다. 이제 함께 화면을 보세요.':'보내지 못했습니다. 진행자에게 알려 주세요.';
 };
 return el;
}
function doneV(){
 const v=TASKS.map((_,i)=>st.mine[i]);const strong=TASKS.filter((_,i)=>v[i]===40).map(t=>t.n),weak=TASKS.filter((_,i)=>v[i]===20).map(t=>t.n);
 const el=$(`<div><div class="notice" id="sv">보내는 중입니다…</div><div class="panel"><p class="label">나의 그래프</p><h1>나의 강점은 ${strong.length?esc(strong.join(', ')):'아직 없음'}</h1>
 ${radar([{v,c:'var(--navy)',sw:2.5,fill:'var(--navy)',fo:.12}],null,null,380)}
 <h3 style="margin-top:14px">짝과 나눌 질문</h3><p class="small">· 내 강점은 어느 분면에 몰려 있고, 비어 있는 곳은 어디인가요? ${weak.length?`(강점이 아닌 과제: ${esc(weak.join(', '))})`:''}</p><p class="small">· 지금 내가 처한 어떤 상황이 이런 모양을 만들었을까요?</p><p class="small">· 학습 스타일(LTM)과 리더십 스타일(LBI) 그래프와 비교하면 같은가요, 다른가요?</p></div>
 <div class="row"><button id="home">처음으로</button></div></div>`);
 el.querySelector('#home').onclick=()=>{st.screen='intro';render()};return el;
}
function createV(){
 const el=$(`<div><div class="panel"><p class="label">진행자</p><h2>새 LTI 대화 만들기</h2>
 <label class="small" for="nm">이름</label><input type="text" id="nm" maxlength="60" placeholder="예: 대덕전자 리더 과정 1기">
 <p class="small" style="margin:14px 0 4px"><b>조직이 바라는 방향</b> (선택) — POCA ‘조직의 현재와 미래’ 결과를 넣으면 리더 그래프와 겹쳐 봅니다. 0~100점.</p>
 <div class="pq">${[1,2,3,4].map(q=>`<div><p class="small" style="margin:0 0 4px"><b style="color:${QC[q]}">${q}</b> ${QN[q]}</p><input type="text" inputmode="numeric" id="c${q}" placeholder="지금" style="margin-bottom:4px"><input type="text" inputmode="numeric" id="d${q}" placeholder="바라는 모습"></div>`).join('')}</div>
 <p class="err" id="err"></p></div><div class="row"><button id="back">처음으로</button><button class="primary" id="go">만들고 코드 받기</button></div></div>`);
 el.querySelector('#back').onclick=()=>{st.screen='intro';render()};
 el.querySelector('#go').onclick=async()=>{
  const name=el.querySelector('#nm').value.trim().slice(0,60)||'LTI 대화';
  const num=id=>{const v=parseFloat(el.querySelector('#'+id).value);return isNaN(v)?null:Math.max(0,Math.min(100,v))};
  const cur={},des={};let has=false;[1,2,3,4].forEach(q=>{cur[q]=num('c'+q);des[q]=num('d'+q);if(des[q]!=null)has=true});
  const A='ACDEFGHJKMNPQRTUVWXY3479';const code=Array.from({length:4},()=>A[Math.floor(Math.random()*A.length)]).join('');
  const d={name,org:has?{cur,des}:null,roles:{},open:true,at:Date.now()};
  try{await caps.db.doc('lti_sessions/'+code).set(d);st.sess={code,...d};st.code=code;st.demo=false;st.marks=[];st.screen='board';render()}catch(e){el.querySelector('#err').textContent='만들지 못했습니다.'}
 };
 return el;
}
async function openList(){
 try{const sn=await caps.db.collection('lti_sessions').limit(100).get();const list=sn.docs.map(d=>({code:d.id,...(d.data()||{})})).sort((a,b)=>(b.at||0)-(a.at||0));
  const app=document.getElementById('app');app.innerHTML='';const el=$(`<div><div class="panel"><h2>진행 중인 LTI 대화</h2>${list.length?list.map(o=>`<div class="task row" style="justify-content:space-between"><span><b>${esc(o.name)}</b> <span class="small muted">· 코드 ${esc(o.code)}</span></span><button data-c="${esc(o.code)}">보드 열기</button></div>`).join(''):'<p class="muted">아직 없습니다.</p>'}</div><div class="row"><button id="home">처음으로</button></div></div>`);
  el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const o=list.find(x=>x.code===b.dataset.c);st.sess=o;st.code=o.code;st.demo=false;st.marks=[];st.screen='board';render()});el.querySelector('#home').onclick=()=>{st.screen='intro';render()};app.append(el)}catch(e){}
}
async function fetchMarks(){
 if(st.demo||!caps.db)return;
 try{const sn=await caps.db.collection('lti_marks').limit(1000).get();st.marks=sn.docs.map(d=>d.data()).filter(x=>x&&x[st.code]).map(x=>x[st.code]);drawBoard()}catch(e){}
}
function boardV(){
 const S=st.sess;
 const el=$(`<div>${st.demo?'<div class="notice">가상의 리더 7명으로 만든 예시 보드입니다. 예시는 저장되지 않습니다.</div>':''}
 <div class="panel" style="padding:24px"><p class="label">LTI 대화 보드</p><div class="row" style="justify-content:space-between;align-items:flex-end"><div><h1 style="margin:0">${esc(S.name)}</h1><p class="muted" style="margin:4px 0 0">참여 <b id="cnt">${st.marks.length}</b>명</p></div><div style="text-align:right"><p class="small muted" style="margin:0">참여 코드</p><div class="code">${esc(st.code)}</div><p class="small muted" style="margin:0">${st.demo?'':`${esc(PAGE_URL)}#${esc(st.code)}`}</p></div></div></div>
 <div id="bd"></div><div class="row"><button id="rf" ${st.demo?'disabled':''}>새로고침</button><button id="home">처음으로</button></div></div>`);
 el.querySelector('#home').onclick=()=>{st.screen='intro';render()};el.querySelector('#rf').onclick=fetchMarks;
 setTimeout(()=>{drawBoard();if(!st.demo){fetchMarks();stopT();st.timer=setInterval(()=>{if(st.screen==='board')fetchMarks();else stopT()},6000)}},0);
 return el;
}
function drawBoard(){
 const S=st.sess,box=document.getElementById('bd');if(!box)return;const c=document.getElementById('cnt');if(c)c.textContent=st.marks.length;
 const M=st.marks.map(x=>x.m).filter(m=>Array.isArray(m)&&m.length===8);
 const meanV=TASKS.map((_,i)=>avg(M.map(m=>m[i])));const strongN=TASKS.map((_,i)=>M.filter(m=>m[i]===40).length);
 const qMean=q=>avg(TASKS.map((t,i)=>t.q===q?meanV[i]:NaN).filter(x=>!isNaN(x)));
 const leaderQ=[1,2,3,4].map(q=>[q,qMean(q)]).sort((a,b)=>b[1]-a[1]);
 const org=S.org;const gap=org?[1,2,3,4].filter(q=>org.des[q]!=null).map(q=>[q,(org.des[q]-(org.cur[q]??org.des[q]))]).sort((a,b)=>b[1]-a[1]):[];
 const empty=TASKS.map((t,i)=>({t,i,n:strongN[i]})).filter(x=>x.n===0);
 const want=gap.length?gap[0][0]:null; const wantCover=want?TASKS.map((t,i)=>({t,i})).filter(x=>x.t.q===want).map(x=>strongN[x.i]):[];
 const webs=[...M.map(m=>({v:m,c:'var(--navy2)',sw:1,o:.7})),...(M.length?[{v:meanV,c:'var(--navy)',sw:2.8,fill:'var(--navy)',fo:.1}]:[])];
 const headline=!M.length?'리더들의 강점이 모이면 여기에 그려집니다':want&&leaderQ[0][0]!==want?`조직은 ${QN[want]} 쪽으로 가고 싶은데, 리더들의 강점은 ${QN[leaderQ[0][0]]}에 모여 있다`:`리더들의 강점은 ${QN[leaderQ[0][0]]}에 가장 많이 모여 있다`;
 box.innerHTML=`<div class="panel"><p class="label">한 원 위에서 보기</p><h2>${headline}</h2>${radar(webs,org?org.des:null,org?org.cur:null,460)}${legendHTML(!!org)}</div>
 <div class="grid2"><div class="panel"><p class="label">과제별 강점 분포</p><table><tr><th>과제</th><th class="n">강점으로 표시</th><th class="n">평균</th></tr>${TASKS.map((t,i)=>`<tr><td><span class="qtag" style="background:${QC[t.q]}">${t.q}</span>${t.n}</td><td class="n"><b style="color:${strongN[i]===0?'var(--red)':'var(--ink)'}">${strongN[i]}명</b></td><td class="n">${isNaN(meanV[i])?'—':meanV[i].toFixed(0)}</td></tr>`).join('')}</table><p class="small muted" style="margin-top:8px">평균은 40(강점) · 30(보통) · 20(강점이 아님)의 평균입니다.</p></div>
 <div class="panel"><p class="label">함께 나눌 질문</p>
  <p class="small">1. 우리 리더들의 강점은 여덟 과제 중 어디에 몰려 있고, 비어 있는 곳은 어디인가?${empty.length?` <b style="color:var(--red)">(아무도 강점으로 고르지 않은 과제: ${empty.map(x=>x.t.n).join(', ')})</b>`:''}</p>
  ${want?`<p class="small">2. 조직이 가장 바라는 변화는 <b>${QN[want]}</b>(+${Math.round(gap[0][1])})입니다. 이 분면의 과제를 강점으로 고른 리더는 ${wantCover.join('명, ')}명입니다. 누가 이 방향을 끌 수 있는가?</p>`:'<p class="small">2. 우리 조직이 가고 싶은 방향은 어느 분면인가? (POCA 결과를 넣으면 그래프에 겹쳐 보입니다)</p>'}
  <p class="small">3. 서로 반대쪽 과제(예: 사람을 돌봄 ↔ 실행 압박, 구조 제공 ↔ 현상에 도전)를 우리는 어떻게 함께 다루고 있는가?</p>
  <p class="small">4. 지금 우리가 처한 어떤 상황이 이런 모양을 만들었는가?</p>
  <p class="small">5. 비어 있는 과제는 누가, 어떻게 채울 것인가?</p></div></div>
 <div class="panel"><p class="label">누가 무엇을 더 맡을까</p><h2>비어 있거나 약한 과제의 역할을 정한다</h2>
  ${TASKS.map((t,i)=>({t,i})).filter(x=>strongN[x.i]<=1||(want&&x.t.q===want)).map(x=>`<div class="task"><p style="margin:0 0 6px"><span class="qtag" style="background:${QC[x.t.q]}">${x.t.q}</span><b>${x.t.n}</b> <span class="small muted">· 강점으로 고른 리더 ${strongN[x.i]}명</span></p><textarea data-r="${x.t.k}" placeholder="누가 · 무엇을 시작하고, 계속하고, 멈출지">${esc((S.roles||{})[x.t.k]||'')}</textarea></div>`).join('')||'<p class="small muted">모든 과제에 강점을 가진 리더가 두 명 이상 있습니다.</p>'}
  <div class="row" style="margin-top:10px"><button class="primary" id="sv" ${st.demo?'disabled':''}>역할 저장</button><span class="small muted" id="svs">${st.demo?'예시는 저장되지 않습니다.':''}</span></div></div>`;
 box.querySelectorAll('[data-r]').forEach(t=>t.oninput=e=>{S.roles=S.roles||{};S.roles[t.dataset.r]=e.target.value.slice(0,600)});
 const sv=box.querySelector('#sv');if(sv)sv.onclick=async()=>{const s=box.querySelector('#svs');s.textContent='저장하는 중…';try{await caps.db.doc('lti_sessions/'+st.code).update({roles:S.roles||{}});s.textContent='저장되었습니다.'}catch(e){s.textContent='저장하지 못했습니다.'}};
}
function demoSess(){return {code:'DEMO',name:'예시 · 리더 과정 1기',org:{cur:{1:55,2:61,3:38,4:40},des:{1:58,2:64,3:43,4:51}},roles:{},open:true}}
function demoMarks(){
 const base=[[30,30,40,40,40,30,20,20],[40,30,30,40,30,30,20,20],[30,20,40,40,40,40,20,30],[40,40,30,30,30,20,20,30],[20,30,40,40,40,40,30,20],[30,30,30,40,40,30,20,20],[40,40,20,30,30,30,30,40]];
 return base.map((m,i)=>({m,nick:''}));
}
render();
(async()=>{
 if(!window.claude||!window.claude.use)return;
 try{caps.user=await window.claude.use('user')}catch(e){}
 try{caps.db=await window.claude.use('db')}catch(e){}
 try{caps.canEdit=caps.user?await caps.user.canEdit():false}catch(e){}
 if(!caps.db)caps.canEdit=false;
 const h=(location.hash||'').replace('#','').trim().toUpperCase();
 if(h&&/^[A-Z0-9]{4,8}$/.test(h))await loadSess(h,false);
 if(st.screen==='intro')render();
 window.addEventListener('hashchange',()=>{const c=(location.hash||'').replace('#','').trim().toUpperCase();if(c&&/^[A-Z0-9]{4,8}$/.test(c)){st.screen='intro';loadSess(c,false)}});
})();
</script>
